name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .cache/desktop-rust-win
            .cache/desktop-sources
            .cache/desktop-sherpa-win
            ~/.cargo/registry
          key: windows-native-v1-${{ hashFiles('script/bootstrap_desktop.py', 'Vendor/DeepFilterNet.Cargo.lock') }}
          restore-keys: windows-native-v1-
      - name: Build and verify Windows packages
        shell: pwsh
        run: ./script/build_desktop.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/desktop-rust-win
            .cache/desktop-sources
            .cache/desktop-sherpa-win
            ~/.cargo/registry
          key: windows-native-v1-${{ hashFiles('script/bootstrap_desktop.py', 'Vendor/DeepFilterNet.Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packages
          path: dist/desktop/*
          if-no-files-found: ignore
