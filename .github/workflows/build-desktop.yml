name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop packages to build
        type: choice
        default: linux
        options: [windows, linux, both, routing]
      package_run:
        description: Existing Linux package run for fast routing verification
        type: string
        default: '38966809384'
permissions:
  contents: read
jobs:
  windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .cache/desktop-rust-win
            .cache/desktop-sources
            .cache/desktop-sherpa-win
            ~/.cargo/registry
          key: windows-native-v1-${{ hashFiles('script/bootstrap_desktop.py', 'Vendor/DeepFilterNet.Cargo.lock') }}
          restore-keys: windows-native-v1-
      - name: Build and verify Windows packages
        shell: pwsh
        run: ./script/build_desktop.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/desktop-rust-win
            .cache/desktop-sources
            .cache/desktop-sherpa-win
            ~/.cargo/registry
          key: windows-native-v1-${{ hashFiles('script/bootstrap_desktop.py', 'Vendor/DeepFilterNet.Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packages
          path: dist/desktop/*
          if-no-files-found: ignore
  linux:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native audio and UI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake pkg-config libpulse-dev pulseaudio pulseaudio-utils patchelf xvfb dbus-x11 xdotool libx11-6 libice6 libsm6 libfontconfig1 libfreetype6 libxkbcommon0 libxext6 libxrandr2 libxcursor1 libxi6 libxrender1 libgl1 fonts-dejavu-core
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .cache/desktop-rust-linux
            .cache/desktop-sources
            .cache/desktop-sherpa-linux
            ~/.cargo/registry
          key: linux-native-v1-${{ hashFiles('script/bootstrap_desktop.py', 'Vendor/DeepFilterNet.Cargo.lock') }}
          restore-keys: linux-native-v1-
      - name: Build and verify Linux packages
        run: ./script/build_desktop_linux.sh
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/desktop-rust-linux
            .cache/desktop-sources
            .cache/desktop-sherpa-linux
            ~/.cargo/registry
          key: linux-native-v1-${{ hashFiles('script/bootstrap_desktop.py', 'Vendor/DeepFilterNet.Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: dist/desktop/*
          if-no-files-found: ignore
  pipewire:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install PipeWire compatibility dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pipewire-pulse wireplumber pulseaudio-utils dbus-x11
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: .cache/linux-artifacts
      - name: Verify packaged app with PipeWire-Pulse
        run: |
          mkdir -p .cache/pipewire-package
          tar -xzf .cache/linux-artifacts/Noise-*-linux-x64.tar.gz -C .cache/pipewire-package --strip-components=1
          dbus-run-session -- ./script/test_linux_audio.sh "$PWD/.cache/pipewire-package" pipewire
  routing:
    if: inputs.platform == 'routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install PipeWire compatibility dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pipewire-pulse wireplumber pulseaudio-utils dbus-x11
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: .cache/linux-artifacts
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - name: Verify current routing code with existing native engines
        run: |
          mkdir -p .cache/routing-package
          tar -xzf .cache/linux-artifacts/Noise-*-linux-x64.tar.gz -C .cache/routing-package --strip-components=1
          dotnet restore Desktop/Noise.Desktop.csproj --locked-mode
          dotnet publish Desktop/Noise.Desktop.csproj -c Release -r linux-x64 --self-contained true -o "$PWD/.cache/routing-package"
          dbus-run-session -- ./script/test_linux_audio.sh "$PWD/.cache/routing-package" pipewire
